<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — SYDE 26</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="lost">
    <div class="wrap">
      <p class="micro">Error 404</p>
      <h1 class="lost-title">This page did not answer the survey.</h1>
      <p class="lost-note">Whatever you were looking for is not here. The class profile is, though.</p>
      <a class="lost-go" id="lost-home" href="/">Back to the profile <span aria-hidden="true">&#8594;</span></a>
    </div>
  </main>
  <script>
    // On a GitHub Pages *project* site the profile lives under /<repo>/, not
    // at the domain root, so a bare "/" sends people to the org root instead
    // of back here. Derive the base from wherever this 404 was served; a
    // custom domain or user site keeps plain "/".
    (function () {
      var seg = location.pathname.split("/").filter(Boolean);
      var onGitHub = /\.github\.io$/.test(location.hostname);
      document.getElementById("lost-home").setAttribute(
        "href", onGitHub && seg.length ? "/" + seg[0] + "/" : "/"
      );
    })();
  </script>
</body>
</html>
