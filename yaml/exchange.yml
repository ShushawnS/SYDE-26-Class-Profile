- type: wordcloud
  title: Reasons for Different Uni
  description: ''
  total: 9
  words:
  - text: I think Europe is a better exchange experience due to the nature of its
      culture (ie locals r more relaxed and chill ppl that r less locked in to school)
    weight: 1
  - text: would’ve preferred a bigger uni in singapore but didn’t have the grades
    weight: 1
  - text: Go to an Asian one, easier grading (or so I've heard), kinder profs, cheaper
      Cost of Living, plus I'd prefer exploring Asia
    weight: 1
  - text: Larger university to make more friends outside of Waterloo
    weight: 1
  - text: Would've liked an english-speaking country
    weight: 1
  - text: Going to Europe would be a better exchange experience, as I believe there's
      more to experience by living in Europe vs Asia. You can leave asia for travelling
      in the future instead!
    weight: 1
  - text: I learned that Spain wasn’t quite right for me
    weight: 1
  - text: school was harder than expected in Singapore, didn't get to travel as much
      as others did
    weight: 1
  - text: Too much like UW
    weight: 1
